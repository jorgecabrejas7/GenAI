extends: ldm02/base

experiment:
  name: ldm03
  variant: base
  description: >-
    ldm02 (sampled latents z=μ+σε, latent_std≈0.9985) + classifier-free guidance.
    Three conditioning buckets; guide porosity and neighbours, position always-on.
    Asymmetric nulls: learned null_por (nn.Parameter) for porosity so that the real
    value zero is never used as the null; all-UNKNOWN availability for neighbours
    (the parity-0 anchor state).  Dropout rates are mutually exclusive per sample.

model:
  use_por_null: true    # enable learned null porosity embedding (nn.Parameter shape C=512)

training:
  early_stopping_patience: 15
  drop_por:   0.10      # drop porosity only          (p_por_only ≈ 0.10)
  drop_joint: 0.05      # drop porosity AND neighbours (p_joint ≈ 0.05, trains ε_∅)
  drop_nb:    0.05      # drop neighbours only         (p_nb_only ≈ 0.05)

guidance:
  s_por: 1.0            # porosity guidance scale (1.0 = un-guided; sweep at generation time)
  s_nb:  1.0            # neighbour guidance scale (1.0 = un-guided; sweep at generation time)
