experiment:
  name: r05
  variant: reduction-factor-64
  description: >-
    R05 latent-compression sweep point: total voxel reduction 64x
    (z_channels=1 at f=4 spatial downsampling). Full R05 setup (dual-branch, XCT+mask heads) with patience-12 early stopping.

extends: r05/base

overrides:
  model:
    z_channels: 1
  training:
    # compile off: pathological autotuned kernel on small-z dualbranch shapes
    # (z=4 measured 7.4 s/step, z=2 measured 7.46 s/step vs ~2.2 eager).
    compile: false
    early_stopping_patience: 12
    early_stopping_metric: val.total
    early_stopping_mode: min
    early_stopping_min_delta: 1.0e-4
    early_stopping_warmup_steps: 4500
