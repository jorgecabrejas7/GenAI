experiment:
  name: vrrae04
  variant: base
  description: >-
    Linear ablation of the VRRAE bottleneck: identical flat architecture
    (vd=2048, rank=300) with the batch-SVD replaced by learned Linear
    mu/expand heads. Controlled comparison vs vrrae runs 0001-0003 to
    determine whether the SVD machinery or the flat-latent capacity is
    responsible for the ~3x L1 reconstruction gap vs spatial baselines.

extends: vrrae/base

components:
  model: models/vae/v2_vrrae_linear.yaml

overrides:
  training:
    # Early stopping on pure validation reconstruction (immune to the beta
    # ramp), matching vrrae03's settings. Patience counts validation checks.
    early_stopping_patience: 12
    early_stopping_metric: val.xct_loss
    early_stopping_mode: min
    early_stopping_min_delta: 1.0e-4
    early_stopping_warmup_steps: 750

# Everything else is inherited from vrrae/base UNCHANGED on purpose — a
# controlled ablation must vary only the bottleneck. In particular:
#   data.batch_size: 768 — no longer a *constraint* (no SVD, so no
#     batch_size >= rank coupling) but kept for step-for-step comparability
#     with vrrae runs 0001-0003.
#   training.total_steps / lr / max_grad_norm: 1.0 / compile: false and the
#     charbonnier+KL loss settings — all held identical to the SVD runs.
#   runtime.run_name fields reference model.vrrae_dim / model.vrrae_rank,
#     both of which this model config still defines.
