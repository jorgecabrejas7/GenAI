experiment:
  name: r06
  variant: reduction-factor-64
  description: >-
    R06 latent-compression sweep point: total voxel reduction 64x
    (z_channels=1 at f=4 spatial downsampling). XCT-only single-branch setup shared via r06/base.

extends: r06/base

overrides:
  model:
    z_channels: 1
  training:
    # compile off: pathological autotuned kernel (7.28 s/step vs ~1.8 normal),
    # same shape-specific autotuner issue as the small-z dualbranch variants.
    compile: false
