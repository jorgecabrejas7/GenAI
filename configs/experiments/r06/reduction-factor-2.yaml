experiment:
  name: r06
  variant: reduction-factor-2
  description: >-
    R06 latent-compression sweep point: total voxel reduction 2x
    (z_channels=32 at f=4 spatial downsampling; latent 32 x 16^3 =
    131072 values vs 262144 input voxels). See r06/base for the
    shared XCT-only single-branch setup.

extends: r06/base

overrides:
  model:
    z_channels: 32
