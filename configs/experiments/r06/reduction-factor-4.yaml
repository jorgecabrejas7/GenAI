experiment:
  name: r06
  variant: reduction-factor-4
  description: >-
    R06 latent-compression sweep point: total voxel reduction 4x
    (z_channels=16 at f=4 spatial downsampling; latent 16 x 16^3 =
    65536 values vs 262144 input voxels). See r06/base for the
    shared XCT-only single-branch setup.

extends: r06/base

overrides:
  model:
    z_channels: 16
