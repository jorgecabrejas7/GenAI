experiment:
  name: ldm07
  variant: base
  description: >-
    The ldm07 rung: ldm06/base with a v-prediction objective and zero terminal
    SNR.  Same latent store, same denoiser, same conditioning contract, same
    budget — only what the network regresses and where the schedule ends.

    Read the two flags in the right order, because the usual justification for
    zero terminal SNR does NOT apply here and saying otherwise would misreport
    what this rung tests.

    Lin et al. 2024 (arXiv:2305.08891) attack a cosine schedule that derives
    alpha_bar as cumprod(1 - beta) after clamping beta, which leaves a terminal
    sqrt(alpha_bar) near 0.068 — a real signal leak.  poregen's DDPMSchedule
    computes alpha_bar directly from the cosine f, and f(T) = cos(pi/2)^2 is
    already zero to float precision.  MEASURED: the Lin rescale moves
    sqrt(alpha_bar) by at most 6.12e-17 anywhere on this schedule.  There is no
    leak to close, and nobody should expect the rescale on its own to move a
    metric.

    What IS broken in ldm06 is the epsilon parameterisation at the terminal
    step.  With sqrt(alpha_bar_T) = 6.12e-17, x0_hat = (x_t - sqrt(1-alpha_bar)
    * eps_hat) / sqrt(alpha_bar) divides by the 1e-8 guard clamp and comes back
    of order 1e8, which the +/-10 clamp then saturates.  Every ldm06 sampling
    chain therefore started from a clamp artefact rather than from a prediction
    — visible as the floor under gen/x0_clamp_sat_frac.

    So:

    (1) objective: v — the substantive change.  The velocity target
        v = sqrt(alpha_bar)*eps - sqrt(1-alpha_bar)*x0 (Salimans & Ho 2022,
        arXiv:2202.00512) recovers x0_hat = sqrt(alpha_bar)*x_t -
        sqrt(1-alpha_bar)*v_hat with NO division, so the terminal step is
        well conditioned (x0_hat = -v_hat, order 1) instead of undefined.
    (2) zero_terminal_snr: true — the exactness that makes (1) honest.  It
        states that x_T is pure noise instead of carrying 6e-17 of signal, and
        it removes the last place the reverse process could divide by a clamp.
        DDPMSchedule refuses this flag with the epsilon objective, because
        there the division is by exactly zero.

    Nothing downstream branches on the objective: the schedule owns
    training_target / predict_x0 / predict_eps, the nested CFG combines raw
    network outputs (an affine combination commutes with the affine v <-> eps
    map at fixed t), and ddim_step converts once.

    Trained FROM SCRATCH.  An epsilon checkpoint predicts a different quantity;
    there is nothing to warm-start from.

    The baseline is ldm06/base, same seed and same budget.  Read
    gen/x0_clamp_sat_frac first — that is the quantity with a mechanical reason
    to move.  Then gen/por_cond_mae and gen/std_ratio_avg.

extends: ldm06/base

overrides:
  noise_schedule:
    objective: v
    zero_terminal_snr: true

  guidance:
    # Lin et al. §3.4 rescale factor.  Off while s_por = s_nb = 1: the
    # correction only has an effect once a guidance scale extrapolates, and
    # switching it on unguided would only add a no-op std ratio of 1.  Set it
    # to 0.7 together with a guidance sweep.
    cfg_rescale: 0.0
