experiment:
  name: ldm06
  variant: split_v4
  description: >-
    ldm06/facedrop_from_start on the split_v4 latent store of an rf-16, z=4
    r08 VAE. Two keys change and nothing else: model.z_channels 8 -> 4 and
    data.latents_root -> data/split_v4/latents_r08z4.

# WHY A FILE (2026-10-13). POREGEN_SPLIT moves data.latents_root's split
# directory and POREGEN_VAE_CHECKPOINT moves vae.checkpoint, but nothing moves
# model.z_channels, and ldm06/base hard-codes 8 (the split_v3 rf-8 VAE). Every
# split_v4 VAE candidate is rf-16 at z=4, so a run from base would build an
# 8-channel denoiser on a 4-channel store. The store directory follows
# scripts/build_latent_dataset.py's default name, latents_<exp>z<z>.
#
# THE VAE IS NOT NAMED HERE. vae.checkpoint is inherited from base (a split_v3
# checkpoint) and MUST be redirected with POREGEN_VAE_CHECKPOINT to the VAE the
# store was encoded with; train_ldm refuses to start when the two disagree.
#
#   POREGEN_SPLIT=split_v4 POREGEN_VAE_CHECKPOINT=runs/vae/<chosen rf-16>/best.ckpt \
#       python scripts/train_ldm.py run ldm06/split_v4
extends: ldm06/facedrop_from_start

overrides:
  model:
    # Input channels = 4 (z) + 2 (orient) + 1 (material) + 24 (6x4 neighbours)
    # + 48 (6x8 availability) + 48 (6x8 nb_t) = 127; UNet3DConfig derives it.
    z_channels: 4
  data:
    latents_root: data/split_v4/latents_r08z4
