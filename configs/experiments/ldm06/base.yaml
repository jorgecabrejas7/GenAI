experiment:
  name: ldm06
  variant: base
  description: >-
    The ldm06 rung: the r08 3-class VAE's latent store (split_v3, z=4, 16³
    latents), six per-face distances, an always-on material map, neighbours
    noised to their own timestep, and one generation path.

    Four things change from ldm05, and all four close the same gap — the model
    never saw the situation the sampler put it in.
    (1) cond_dist was ONE scalar (distance to the nearest outer face over all
        three axes), so a patch under the top surface and a patch against a
        side wall asked for the same thing.  cond_dist6 gives one distance per
        face, so "which side does the specimen end on" is answerable.
    (2) cond_material (specimen-ENVELOPE fraction per latent cell, label != 2
        so pores count as specimen) is part of the contract, not a flag.
        Exterior air and the drilled registration holes become something the
        model is TOLD about instead of an unexplained dark region it has to
        invent.  It is the envelope and not the solid fraction on purpose:
        pooling label == 0 would be the pore mask at 100 micron cells, and the
        model would learn to upsample it instead of generating pores.
    (3) Neighbours arrive noised.  Training draws a per-neighbour t_nb — with
        probability nb_t_mix the target's own t, otherwise Uniform{0..t} — and
        passes nb_t to the denoiser.  ldm05 only ever showed clean neighbours,
        which is why the joint sampler had to drop neighbour conditioning
        entirely and s_nb was inert.
    (4) One sampler: hybrid chunked joint denoising.  Chunks of chunk_tiles
        64-voxel tiles in raster order, overlapping windows jointly denoising
        each chunk's canvas, real neighbours from the canvas or from finished
        chunks re-noised to the same t.  Decode is overlapped and blended, so
        the decoder-side seam at every 64-voxel face is gone too.

    Trained FROM SCRATCH: the input channel count and the latent store both
    changed, so there is nothing to warm-start from.

loss: {}

model:
  type: unet3d
  z_channels: 4
  base_channels: 128
  channel_mult: [1, 2, 4]
  n_res_blocks: 2
  attn_at_bottleneck: false
  bottleneck_downsample: true
  cond_embed_dim: 512
  # Input channels = 4 (z) + 2 (orient) + 1 (material) + 24 (6×4 neighbours)
  #                + 48 (6×8 availability) + 48 (6×8 nb_t) = 127.
  nb_avail_embed_dim: 8
  nb_t_embed_dim: 8
  n_attn_heads: 8
  dropout: 0.0
  # There are no conditioning switches any more.  Orientation, material,
  # neighbours, availability, nb_t, porosity (with its learned null), depth and
  # the six face distances are always on: a switch no config flips is only a
  # way for training and generation to disagree.

noise_schedule:
  type: cosine
  T: 1000
  s: 0.008

vae:
  # PLACEHOLDER — replace with the exact r08 checkpoint before launching.
  # runs/vae/r08-run-*/best.ckpt is not resolved for you on purpose: the latent
  # store's metadata.json records which checkpoint encoded it, and
  # train_ldm._load_vae_decoder compares the two and refuses to start on a
  # mismatch.  Decoding with a different VAE than the encoder that produced the
  # latents is silently wrong, so it must be a hard stop, not a guess.
  checkpoint: runs/vae/r08-run-REPLACE-ME/best.ckpt

training:
  seed: 42
  batch_size: 256
  ema_decay: 0.9999
  lr: 1.0e-4
  weight_decay: 0.01
  # 130k: the step count we intend to run, so the cosine schedule completes.
  # ldm04 was stopped at 120k with its schedule only 60 % through and the LR
  # never reached lr_min.
  total_steps: 130000
  max_grad_norm: 1.0
  scheduler: cosine
  lr_min: 1.0e-5
  warmup_steps: 250
  log_every: 10
  eval_every: 500
  val_batches: 50
  full_val_every: 2000
  early_stopping_patience: 15
  save_every: 2000
  compile: true
  # Conditioning drawn from real val rows, so gen/por_cond_mae measures
  # conditional adherence directly.
  gen_eval_every: 2000
  gen_eval_samples: 64
  gen_eval_ddim_steps: 50
  # One chunk of 3×3×3 tiles = a 192³ volume, i.e. exactly the unit the
  # production sampler denoises jointly.  The sample therefore exercises the
  # real window overlap, the real neighbour sources and the real blended
  # decode, and samples/seam_* are the same numbers a generation run reports.
  sample_every: 10000
  sample_ddim_steps: 50
  sample_grid: [3, 3, 3]
  sample_global_por: 0.02
  sample_layup: [45, -45, 90, 0, 45, -45, 0, 90, -45, 45]   # layup A, 74/78 specimens
  sample_ply_thickness_vox: 19.6                            # measured pitch (T-A)
  # CFG dropout.  drop_por swaps in the learned null porosity token; drop_nb
  # sends all six neighbours of an item to UNKNOWN at nb_t 0 — the same null
  # the guided sampler uses, so the two cannot drift.
  drop_por: 0.1
  drop_nb: 0.1
  # Probability that a neighbour is noised to the TARGET's timestep rather than
  # to Uniform{0..t}.  Half and half: t_nb == t is the case the sampler runs in
  # (both the live chunk canvas and a re-noised finished chunk sit at t), and
  # the lower draws keep the model from assuming it.
  nb_t_mix: 0.5

guidance:
  s_por: 1.0
  s_nb: 1.0

generation:
  # Hybrid chunked joint denoising — the only generation path.
  #   chunk_tiles   tiles per jointly denoised chunk. (3,3,3) = 192³ voxels.
  #                 (1,1,1) is patch-at-a-time; one chunk over the whole volume
  #                 is pure joint denoising and needs the whole canvas resident.
  #   window_stride voxels between denoising window origins inside a chunk
  #                 (32 = 50 % overlap).
  #   decode_stride voxels between decode window origins; the decoded grey and
  #                 3-class logits are blended with a tapered window before the
  #                 argmax, which is what removes the decoder-side seam.
  chunk_tiles: [3, 3, 3]
  window_stride: 32
  decode_stride: 32
  window_batch: 32

data:
  latents_root: data/split_v3/latents_r08z4
  latent_mode: sampled     # z = μ + σ·ε per batch (normalised space); 'mean' uses μ
  # Three distinct parameters.  sample_stride stays 32: it is only a
  # training-data multiplier.  The store holds eight interleaved copies of the
  # stride-64 grid and a face neighbour is two sampling steps away, so it
  # already exists — no dataset rebuild.
  sample_stride: 32        # dataset density: spacing of stored patches
  generation_stride: 64    # tiling grid: the unit the seam metric measures
  neighbour_offset: 64     # face neighbours TOUCH the target: zero shared voxels
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

runtime:
  runs_root: runs/ldm
  device:
    gpu_id: null
  checkpoints:
    save_latest: true
    save_best: true
    best_metric: val.loss
    best_mode: min
  resume:
    prune_jsonl: true
  metadata:
    capture_git: true
    capture_machine: true
    capture_environment: true
  run_name:
    timestamp_format: "%Y%m%d-%H%M%S"
    run_index_width: 4
    fields:
      - label: z
        path: model.z_channels
      - label: c
        path: model.base_channels
      - label: bs
        path: training.batch_size
      - label: lr
        path: training.lr
        transform: sci
  machine:
    name: dgx_spark
    accelerator: NVIDIA GB10 Blackwell
