experiment:
  name: r07
  variant: reduction-factor-4
  description: >-
    R07 full-AE (XCT+mask in/out) sweep point: total voxel reduction 4x
    (z_channels=16 at f=4 spatial downsampling). See r07/base.

extends: r07/base

overrides:
  model:
    z_channels: 16
  training:
    # compile off: the autotuner picks pathological kernels for most dualbranch
    # z shapes (z=16 in_ch=2 measured 7.8 s/step vs ~2.2 eager). Eager for the
    # whole r07 sweep — no more step-60 restarts.
    compile: false
