experiment:
  name: ldm01
  variant: base
  description: >-
    First LDM run — 3D U-Net DDPM denoiser, cosine schedule T=1000,
    conditioned on 6-connected neighbors + availability + spatial position + dual-porosity VVF.

loss: {}

model:
  type: unet3d
  z_channels: 16
  base_channels: 128
  channel_mult: [1, 2, 4]
  n_res_blocks: 2
  attn_at_bottleneck: false
  bottleneck_downsample: true
  cond_embed_dim: 512
  nb_avail_embed_dim: 8
  n_attn_heads: 8
  dropout: 0.0

noise_schedule:
  type: cosine
  T: 1000
  s: 0.008

training:
  seed: 42
  batch_size: 128
  ema_decay: 0.9999
  lr: 1.0e-4
  weight_decay: 0.01
  total_steps: 500000
  max_grad_norm: 1.0
  scheduler: cosine
  lr_min: 1.0e-5
  warmup_steps: 250
  log_every: 10
  eval_every: 62
  val_batches: 50
  full_val_every: 1000
  early_stopping_patience: 25
  save_every: 625
  compile: true
  sample_every: 625
  sample_ddim_steps: 20
  sample_grid: [3, 3, 3]
  sample_global_por: 0.02
  sample_vae_run: runs/vae/r05-run-0001-20260420-142643-archv2-conv_noattn_dualbranch-z16-c32-bs128-lr2e-04-b0.050-fb0.1-klw0-schednone

data:
  latents_root: data/split_v2/latents_s64
  patch_stride: 32
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

runtime:
  runs_root: runs/ldm
  device:
    gpu_id: null
  checkpoints:
    save_latest: true
    save_best: true
    best_metric: val.loss
    best_mode: min
  resume:
    prune_jsonl: true
  metadata:
    capture_git: true
    capture_machine: true
    capture_environment: true
  run_name:
    timestamp_format: "%Y%m%d-%H%M%S"
    run_index_width: 4
    fields:
      - label: z
        path: model.z_channels
      - label: c
        path: model.base_channels
      - label: s
        path: data.patch_stride
      - label: bs
        path: training.batch_size
      - label: lr
        path: training.lr
        transform: sci

  machine:
    name: dgx_spark
    accelerator: NVIDIA GB10 Blackwell
