experiment:
  name: vrrae
  variant: b_fallback
  description: >-
    B at the smaller batch, for use ONLY if B itself will not fit. Separate
    file rather than an edit to B: the two are different experiments, and which
    one ran has to stay answerable from the config and the run name after the
    fact.

extends: vrrae/b

overrides:
  model:
    vrrae_rank: 768
  data:
    batch_size: 1024
    # A BATCH OF 1024 64-CUBED PATCHES IS 1.0 GiB, and every worker holds one
    # in flight. At the inherited 4 workers that is 4 GiB of prefetched input
    # on top of the model, the optimiser and the SVD's backward intermediates —
    # on a machine where host and device share 121 GB. The first attempt at
    # this configuration took the WHOLE HOST out of memory at 02:29 on
    # 2026-09-23: the kernel's OOM killer took wireplumber, pipewire and the
    # tmux server, and the run died at step 6 with its dataloader workers
    # killed. Halved, with prefetch already at 1 and persistence off so nothing
    # is held between epochs.
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 1
  training:
    total_steps: 7857  # 5.035 epochs over split_v3 at batch 1024
