experiment:
  name: vrrae
  variant: a
  description: >-
    A — one more stride-2 convolution, NO fully-connected projection, and a
    much wider RR rank. The question is whether the flat bottleneck's cost is
    the FC layer that precedes it rather than the rank reduction itself.

    THE CHANNEL LAYOUT, COMPUTED NOT ASSUMED. base_channels 32 over 6 blocks
    gives 32, 64, 128, 256, 512, 1024, and six stride-2 steps take a 64-voxel
    patch to 1 voxel. So the encoder's flattened tensor is

        1024 channels x 1^3 = 1024

    against vrrae04's 512 x 2^3 = 4096. The tensor is FOUR TIMES SMALLER and
    entirely in the channel dimension — there is no spatial extent left at all,
    which is the other thing this arm changes and which its result must be read
    against.

    NO FC IS NOT A NEW CODE PATH. Setting vrrae_dim equal to the flattened
    width makes both fc_in and its decoder mirror `nn.Identity()` — see
    `src/poregen/models/vae/v2/vrrae.py`, which already chooses Identity over
    Linear when the widths match. So the RR layer operates directly on the
    encoder's own output.

    THE RANK <= BATCH CONSTRAINT IS SATISFIED WITH HEADROOM: rank 768 against
    batch 1024. RRLayer silently CLIPS the effective rank to the batch size, so
    a batch below the rank would train a narrower bottleneck than the config
    claims and nothing would say so.

extends: vrrae/base

overrides:
  model:
    n_blocks: 6
    base_channels: 32
    # = channel_schedule()[5] * latent_spatial**3 = 1024 * 1**3. Equal to the
    # flattened width ON PURPOSE: that is what removes the FC.
    vrrae_dim: 1024
    vrrae_rank: 768
  data:
    # SPLIT_V3, NOT the split_v2 that vrrae/base inherits. The point of this
    # arm is to sit beside the r08 rungs and the paper's baselines, and those
    # are measured on split_v3. The two val sets are not equally hard —
    # predicting the dataset mean scores 0.153 on split_v2 and 0.066 on
    # split_v3 — so a number from one cannot be read against a number from the
    # other. `vrrae/beta0` deliberately stays on split_v2, because it is
    # defined as a ONE-VARIABLE change to vrrae04 and must not move two things.
    dataset_root: split_v3
    # >= vrrae_rank, and by a margin: the constraint is on the EFFECTIVE batch,
    # so a short trailing batch must not silently narrow the bottleneck.
    batch_size: 1024
    # A BATCH OF 1024 64-CUBED PATCHES IS 1.0 GiB, and every worker holds one
    # in flight. At the inherited 4 workers that is 4 GiB of prefetched input
    # on top of the model, the optimiser and the SVD's backward intermediates —
    # on a machine where host and device share 121 GB. The first attempt at
    # this configuration took the WHOLE HOST out of memory at 02:29 on
    # 2026-09-23: the kernel's OOM killer took wireplumber, pipewire and the
    # tmux server, and the run died at step 6 with its dataloader workers
    # killed. Halved, with prefetch already at 1 and persistence off so nothing
    # is held between epochs.
    num_workers: 2
    persistent_workers: false
    prefetch_factor: 1
  training:
    # 5.035 epochs over split_v3's 1 598 000 train patches at
    # batch 1024. NOT 71690*128/batch: that rule was calibrated on
    # split_v2's 1 822 599 patches, and reusing it here would train
    # 14 % more epochs than every other rung in the family.
    total_steps: 7857
