experiment:
  name: r08
  variant: base
  description: >-
    R08 — the production VAE for ldm06, on data/split_v3. Same trunk and
    hyperparameters as the r07 point that produced the current latent store
    (r07/reduction-factor-16: z_channels 4, base 32, bs 128, lr 2e-4,
    beta 0.05, free_bits 0.1, disc_weight 0.05, compile off, early stopping
    patience 12 on val.total after 4500 warmup steps). Two things change:
    the dataset is split_v3 (drilled holes removed, split by panel), and the
    model is the 3-class variant — encoder input cat([xct, pore, air]),
    decoder emitting material/pore/air logits instead of a binary pore mask.

# r07/reduction-factor-16 is the variant that produced
# runs/vae/r07-run-0006-...-z4-c32-..., the VAE behind
# data/split_v2/latents_r07z4. It is z_channels 4 — "reduction-factor-4" is
# z_channels 16, a different sweep point.
extends: r07/reduction-factor-16

overrides:
  model:
    name: v2.conv_noattn_dualbranch_cls
    # XCT + pore plane + air plane. Material is implied by both being zero.
    # Not a switch: the variant rejects any other value.
    in_channels: 3
    z_channels: 4

  training:
    # Patience in STEPS, not eval checks. eval_every is DERIVED from the split
    # sizes, so counting patience in checks makes it depend on the data: the
    # split_v3 re-split grew val 89 % by moving Na_01 into it, which halved
    # eval_every from 264 to 120 and with it the effective patience, 3168
    # training steps down to 1440 — without any config changing. All six rungs
    # share this dataset so they would have been self-consistent, but nothing
    # would have been comparable with run-0002 or r07 and nobody would have
    # noticed. 3000 is run-0002's 3168 to the nearest round number.
    #
    # The inherited eval-check field must be 0: the two are the same knob in
    # different units and train_vae raises if both are set.
    early_stopping_patience: 0
    early_stopping_patience_steps: 3000

  data:
    # PINNED host buffers (configs/machines/dgx_spark.yaml says false). On the
    # GB10 the GPU reads pageable host memory through the CPU page tables
    # (PAGEABLE_MEMORY_ACCESS_USES_HOST_PAGE_TABLES = 1), so an unpinned
    # transfer depends on reclaimable, swappable pages. Every hang the VAE
    # family had (rf-2 at 9000, rf-8 v4 at 25000 and 36102, vrrae) sat in a
    # pageable host<->GPU copy; the LDM family, pinned, never hung. The
    # author's decision, 2026-10-08. Numerics are unchanged.
    pin_memory: true
    dataset_root: split_v3
    split_version: v2   # the parquet's own "split" column; v3 splits are baked in

  loss:
    # Three-class head: weighted cross-entropy + soft Dice over the minority
    # classes. The binary-mask keys inherited from r07 (mask_bce_*, use_focal,
    # use_tversky, mask_dice_weight) are inert here — compute_total_loss
    # branches on which head the model actually emits, and this variant emits
    # class_logits only.
    class_ce_weight: 1.0
    class_dice_weight: 1.0
    # Dice is averaged over pore and air only. Material is the background: its
    # Dice sits near 1 whatever the model does, so scoring it would dilute the
    # signal from the two classes that matter.
    class_dice_classes: [1, 2]
    # w_c proportional to 1/sqrt(f_c), normalised so sum_c f_c * w_c = 1, so
    # the weighted loss keeps the magnitude of an unweighted one. Measured on
    # the ACTIVE split's TRAIN patches by its build (--stage weights) and read
    # at resolution from <data root>/class_weights.json ("from_split"); the
    # resolved config carries the values and loss.class_weights_source. On
    # split_v3: 0.767078 / 5.052971 / 2.587425 (train frequencies
    # 0.900142 / 0.020744 / 0.079114 over 1598000 patches). Without
    # weights the loss is dominated by material and both minority classes
    # collapse, so compute_total_loss refuses to run when this is unset.
    #
    # TEMPERED (sqrt) rather than full inverse frequency. r08-run-0002 used
    # 1/f_c, which put pore at 16.1 and made a false positive cheap enough that
    # the model over-predicted pore ~2.2x wherever porosity was appreciable —
    # on TRAINING panels too. Dividing that model's softmax back by its own
    # weights cut the worst-bin porosity MAE 7.7x (0.04258 -> 0.00551) AND
    # improved pore Dice, so the bias was calibration from the weights rather
    # than a recall/precision trade. See
    # runs/campaigns/09-r08-latent-sweep/calibration_probe/.
    #
    # NOT A LITERAL: a literal is the weights of the split it was copied from.
    # It made the first split_v4 VAE train with split_v3's weights (2026-10-08).
    class_weights: from_split
