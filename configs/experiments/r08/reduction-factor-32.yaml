experiment:
  name: r08
  variant: reduction-factor-32
  description: >-
    R08 latent-compression rung: total voxel reduction 32x (z_channels=2 at
    f=4 spatial downsampling). Same protocol as r08/base — 3-class head on
    split_v3, early stopping patience 12 on val.total. The rung number is the
    TOTAL VOXEL reduction: 64^3 input voxels against z_channels * 16^3 latent
    values, so z=2 gives 32x. See r08/base.

extends: r08/base

overrides:
  model:
    z_channels: 2
